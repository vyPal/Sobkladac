name: CI

on: push

jobs:
  lint_and_check:
    name: Code Formatting and Static Analysis
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linting Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck clang-tidy

      - name: Run Makefile checks
        run: make check

  build-and-test:
    name: Build Project and Run Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Standard Executable
        run: make build

      - name: Run Unit Tests
        run: make test

  test-asan:
    name: Tests with AddressSanitizer
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Run ASan Tests
        run: make test-asan
